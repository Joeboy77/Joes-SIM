# The optional community backend (Phase 11). See README.md in this folder for deploying.
name = "joes-sim-api"
main = "src/worker.ts"
compatibility_date = "2026-06-01"

[[d1_databases]]
binding = "DB"
database_name = "joes-sim"
# Replace with the id that `wrangler d1 create joes-sim` prints. Local runs ignore it.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
# The sites allowed to call the API, separated by commas.
ALLOWED_ORIGINS = "http://localhost:3000,http://localhost:4317"

# Once a day, delete expired rate-limit counters.
[triggers]
crons = ["17 3 * * *"]
